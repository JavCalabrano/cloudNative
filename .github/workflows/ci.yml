name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    name: Build y tests (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y ejecutar tests
        run: mvn -B clean verify

      - name: Subir reportes de test (opcional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            document-service/target/surefire-reports/
            storage-service/target/surefire-reports/
          if-no-files-found: ignore