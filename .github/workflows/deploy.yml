name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build y Push a DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push - Document Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./document-service/Dockerfile
          push: true
          no-cache: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/document-service:latest

      - name: Build y Push - Storage Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./storage-service/Dockerfile
          push: true
          no-cache: true1
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/storage-service:latest

  deploy:
    name: Desplegar en EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar Docker Compose en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/app
            cd /home/ubuntu/app
            
            echo "version: '3.8'" > docker-compose.yml
            echo "services:" >> docker-compose.yml
            echo "  storage-service:" >> docker-compose.yml
            echo "    image: ${{ secrets.DOCKERHUB_USERNAME }}/storage-service:latest" >> docker-compose.yml
            echo "    container_name: storage-service" >> docker-compose.yml
            echo "    ports:" >> docker-compose.yml
            echo "      - '8081:8081'" >> docker-compose.yml
            echo "    volumes:" >> docker-compose.yml
            echo "      - /mnt/efs:/mnt/efs" >> docker-compose.yml
            echo "    environment:" >> docker-compose.yml
            echo "      - AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> docker-compose.yml
            echo "      - AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> docker-compose.yml
            echo "      - AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}" >> docker-compose.yml
            echo "      - AWS_REGION=${{ secrets.AWS_REGION }}" >> docker-compose.yml
            echo "      - S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> docker-compose.yml
            echo "    user: root" >> docker-compose.yml
            echo "  document-service:" >> docker-compose.yml
            echo "    image: ${{ secrets.DOCKERHUB_USERNAME }}/document-service:latest" >> docker-compose.yml
            echo "    container_name: document-service" >> docker-compose.yml
            echo "    ports:" >> docker-compose.yml
            echo "      - '8080:8080'" >> docker-compose.yml
            echo "    environment:" >> docker-compose.yml
            echo "      - STORAGE_SERVICE_URL=http://storage-service:8081" >> docker-compose.yml
            echo "    depends_on:" >> docker-compose.yml
            echo "      - storage-service" >> docker-compose.yml

            # Limpiamos contenedores viejos y levantamos los nuevos
            docker rm -f document-service storage-service || true
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f