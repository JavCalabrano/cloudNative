name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build y Push a DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push - Document Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./document-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/document-service:latest

      - name: Build y Push - Storage Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./storage-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/storage-service:latest

  deploy:
    name: Desplegar en EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Copiar docker-compose.yml a la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/app"

      - name: Ejecutar Docker Compose en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/app
            cd /home/ubuntu/app

      # 2. Crear el archivo docker-compose.yml desde el script
            cat << 'EOF' > docker-compose.yml
            version: '3.8'
            services:
              storage-service:
                image: ${DOCKERHUB_USERNAME}/storage-service:latest
                container_name: storage-service
                ports:
                  - "8081:8081"
                volumes:
                  - /mnt/efs:/mnt/efs
                environment:
                  - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
                  - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
                  - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
                  - AWS_REGION=${AWS_REGION}
                  - S3_BUCKET_NAME=${S3_BUCKET_NAME}
                user: root
              document-service:
                image: ${DOCKERHUB_USERNAME}/document-service:latest
                container_name: document-service
                ports:
                  - "8080:8080"
                environment:
                  - STORAGE_SERVICE_URL=http://storage-service:8081
                depends_on:
                  - storage-service
            EOF

    # 3. Crear el .env (OJO: el cat usa 'EOF' sin comillas para expandir las variables)
              cat << EOF > .env
              DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
              AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
              AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
              AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}
              AWS_REGION=${{ secrets.AWS_REGION }}
              S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
            EOF

    # 4. Limpiar contenedores viejos y levantar los nuevos
            docker rm -f document-service storage-service || true
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f