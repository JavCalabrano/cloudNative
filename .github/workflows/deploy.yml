name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build y Push a DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push - Document Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/document-service:latest

      - name: Build y Push - Storage Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/storage-service:latest

  deploy:
    name: Desplegar en EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar comandos en EC2 vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Login en DockerHub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # 2. Descargar las últimas imágenes
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/document-service:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/storage-service:latest
            
            # 3. Detener y eliminar contenedores anteriores (ignora errores si no existen)
            docker stop storage-service document-service || true
            docker rm storage-service document-service || true
            
            # 4. Iniciar storage-service (inyectando credenciales de AWS y config de EFS)
            docker run -d --name storage-service \
              --user root \
              -p 8081:8081 \
              -v /mnt/efs:/mnt/efs \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e AWS_SESSION_TOKEN="${{ secrets.AWS_SESSION_TOKEN }}" \
              -e AWS_REGION="${{ secrets.AWS_REGION }}" \
              -e S3_BUCKET_NAME="${{ secrets.S3_BUCKET_NAME }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/storage-service:latest
            
            # 5. Iniciar document-service (conectado al storage)
            docker run -d --name document-service \
              -p 8080:8080 \
              -e STORAGE_SERVICE_URL="http://localhost:8081" \
              ${{ secrets.DOCKERHUB_USERNAME }}/document-service:latest
            
            # 6. Limpieza de imágenes no usadas (opcional)
            docker image prune -f